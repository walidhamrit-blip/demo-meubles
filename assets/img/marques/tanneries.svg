    <text x="18" y="27.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#231f1d">TP</text>
    <text x="52" y="27.5" font-family="Georgia,'Times New Roman',serif" font-size="16" letter-spacing="2.2" textLength="85" lengthAdjust="spacing" fill="#231f1d">TANNERIES</text>
